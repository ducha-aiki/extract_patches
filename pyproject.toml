[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extract_patches"
dynamic = ["version"]
description = "Function for local patch extraction from OpenCV keypoints with proper blurring"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dmytro Mishkin", email = "ducha.aiki@gmail.com" },
    { name = "Vassileios Balntas" },
]
keywords = ["patch", "opencv", "local features", "local descriptors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opencv-python>=4.5.5.64",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/ducha-aiki/extract_patches"
Documentation = "https://ducha-aiki.github.io/extract_patches/"
Repository = "https://github.com/ducha-aiki/extract_patches"

[tool.setuptools]
packages = ["extract_patches"]

[tool.setuptools.dynamic]
version = { attr = "extract_patches.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
