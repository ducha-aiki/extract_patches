name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / OpenCV ${{ matrix.opencv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            opencv: "4.5.5.64"
            numpy: "1.24.4"
          - python: "3.12"
            opencv: "4.13.0.92"
            numpy: "2.2.6"
          - python: "3.13"
            opencv: "5.0.0.93"
            numpy: "2.3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install compatibility set
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==${{ matrix.numpy }}" "opencv-python-headless==${{ matrix.opencv }}" "matplotlib>=3.7" pytest
          python -m pip install --no-deps -e .
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
